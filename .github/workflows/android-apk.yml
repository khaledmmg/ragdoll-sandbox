name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace packages
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bounce-lab-android-apk
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
